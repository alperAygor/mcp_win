[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archmcp-opensees"
version = "0.1.0"
description = "Minimal MCP server that lets an AI assistant write and run OpenSeesPy structural-analysis scripts in an isolated folder."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.9.0", "openseespy==3.8.0.0", "numpy"]

[project.scripts]
archmcp-opensees = "archmcp_opensees:main"

[tool.setuptools]
packages = ["archmcp_opensees"]
